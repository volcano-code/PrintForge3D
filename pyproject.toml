[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printforge3d"
version = "0.1.0"
description = "Print-aware multi-view 3D reconstruction and geometry quality toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
vision = ["numpy>=1.26", "open3d>=0.18", "opencv-python>=4.9", "pycolmap>=3.10"]
ml = ["torch>=2.2", "torchvision>=0.17"]

[project.scripts]
printforge = "printforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
